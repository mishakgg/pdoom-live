name: pipeline

on:
  push:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "data/fixtures/**"
      - "packages/contracts/**"
      - "pytest.ini"
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "data/fixtures/**"
      - "packages/contracts/**"
      - "pytest.ini"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install defusedxml pytest
      - run: PYTHONPATH=pipeline python -m pytest
