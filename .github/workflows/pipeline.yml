name: pipeline

on:
  push:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "data/fixtures/**"
      - "packages/contracts/**"
      - "pytest.ini"
      - ".github/workflows/pipeline.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "data/fixtures/**"
      - "packages/contracts/**"
      - "pytest.ini"
      - ".github/workflows/pipeline.yml"

# Fork pull requests run this file. Keep the token read-only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install defusedxml pytest
      - run: PYTHONPATH=pipeline python -m pytest
