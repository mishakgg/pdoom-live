name: runtime

on:
  push:
  pull_request:

# Fork pull requests run this file. Build and smoke-test the image only.
# Do not attach deployment credentials, write tokens, or a production database.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t pdoom-live:ci .
      - name: Smoke-test the image
        run: bash scripts/runtime-smoke.sh pdoom-live:ci
      - name: Validate production compose and proxy
        run: |
          bash scripts/deploy/validate-config.sh
          bash scripts/deploy/proxy-health.sh
          bash scripts/deploy/measure-switch.sh
      - name: Backup and restore drill
        run: PDOOM_IMAGE=pdoom-live:ci bash scripts/restore/drill.sh
