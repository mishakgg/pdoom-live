name: One-time Vitest 4.1.11 resolver

on:
  push:
    branches: [audit/vitest-4-1-11-resolver-2026-10-08]
    paths: [.github/workflows/resolve-vitest-once.yml]

# Isolated metadata-only diagnostic branch. Never merge this workflow/branch.
permissions:
  contents: read
concurrency:
  group: vitest-4-1-11-resolver-2026-10-08
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'mishakgg/pdoom-live'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 87dda3d74f9f9874e82d83d1628b53f9da4b5526
          persist-credentials: false
          fetch-depth: 1
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          check-latest: false
      - name: Resolve approved development metadata and audit without package execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          """Vitest 4.1.11 metadata-only resolver proposal. No package or project execution."""
          import base64
          import copy
          import hashlib
          import json
          import os
          import selectors
          import signal
          import time
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          from urllib.parse import urlparse
          
          BASE_COMMIT = '87dda3d74f9f9874e82d83d1628b53f9da4b5526'
          LOCK_SHA256 = 'df7cd804586c93bc8e240a86c7b9c6948759d19234411a2d939038e9b1573514'
          TARGET = '4.1.11'
          ROOT_SPEC = '~4.1.11'
          EXPECTED_INPUT_SHA256 = json.loads('{"package.json": "b3265a2ea5dcbf91c174fc74b6529be1712ce00af1c04d3a284ac0f197c710bb", "package-lock.json": "df7cd804586c93bc8e240a86c7b9c6948759d19234411a2d939038e9b1573514", "apps/web/package.json": "8678eb30e9dec02b77d18182eb6c4346c952193966bea1bc332106588df7dd08", "packages/db/package.json": "68a87cc7337217ce2e6befd9989eb203f20b3aa62fcf5ef8e93ebff62fc5f26b", "packages/contracts/package.json": "9e34f06f7ded54afeb032f0641171b6ed6426c1b11c71ecd84af32cc3f85a9d9", "packages/observability/package.json": "8299d67d1c353c3ba0c1f1610e239dd4659c8c40bade73ca88b38fcb893a2318"}')
          POLICY = json.loads('{"family_metadata": {"node_modules/@vitest/mocker": {"version": "4.1.11", "dev": true, "license": "MIT", "funding": {"url": "https://opencollective.com/vitest"}, "dependencies": {"@vitest/spy": "4.1.11", "estree-walker": "^3.0.3", "magic-string": "^0.30.21"}, "peerDependencies": {"msw": "^2.4.9", "vite": "^6.0.0 || ^7.0.0 || ^8.0.0"}, "peerDependenciesMeta": {"msw": {"optional": true}, "vite": {"optional": true}}}, "node_modules/@vitest/snapshot": {"version": "4.1.11", "dev": true, "license": "MIT", "funding": {"url": "https://opencollective.com/vitest"}, "dependencies": {"@vitest/pretty-format": "4.1.11", "@vitest/utils": "4.1.11", "magic-string": "^0.30.21", "pathe": "^2.0.3"}}, "node_modules/@vitest/utils": {"version": "4.1.11", "dev": true, "license": "MIT", "funding": {"url": "https://opencollective.com/vitest"}, "dependencies": {"@vitest/pretty-format": "4.1.11", "convert-source-map": "^2.0.0", "tinyrainbow": "^3.1.0"}}, "node_modules/@vitest/expect": {"version": "4.1.11", "dev": true, "license": "MIT", "funding": {"url": "https://opencollective.com/vitest"}, "dependencies": {"@standard-schema/spec": "^1.1.0", "@types/chai": "^5.2.2", "@vitest/spy": "4.1.11", "@vitest/utils": "4.1.11", "chai": "^6.2.2", "tinyrainbow": "^3.1.0"}}, "node_modules/@vitest/pretty-format": {"version": "4.1.11", "dev": true, "license": "MIT", "funding": {"url": "https://opencollective.com/vitest"}, "dependencies": {"tinyrainbow": "^3.1.0"}}, "node_modules/vitest": {"version": "4.1.11", "dev": true, "license": "MIT", "funding": {"url": "https://opencollective.com/vitest"}, "dependencies": {"@vitest/expect": "4.1.11", "@vitest/mocker": "4.1.11", "@vitest/pretty-format": "4.1.11", "@vitest/runner": "4.1.11", "@vitest/snapshot": "4.1.11", "@vitest/spy": "4.1.11", "@vitest/utils": "4.1.11", "es-module-lexer": "^2.0.0", "expect-type": "^1.3.0", "magic-string": "^0.30.21", "obug": "^2.1.1", "pathe": "^2.0.3", "picomatch": "^4.0.3", "std-env": "^4.0.0-rc.1", "tinybench": "^2.9.0", "tinyexec": "^1.0.2", "tinyglobby": "^0.2.15", "tinyrainbow": "^3.1.0", "vite": "^6.0.0 || ^7.0.0 || ^8.0.0", "why-is-node-running": "^2.3.0"}, "peerDependencies": {"@edge-runtime/vm": "*", "@opentelemetry/api": "^1.9.0", "@types/node": "^20.0.0 || ^22.0.0 || >=24.0.0", "@vitest/browser-playwright": "4.1.11", "@vitest/browser-preview": "4.1.11", "@vitest/browser-webdriverio": "4.1.11", "@vitest/coverage-istanbul": "4.1.11", "@vitest/coverage-v8": "4.1.11", "@vitest/ui": "4.1.11", "happy-dom": "*", "jsdom": "*", "vite": "^6.0.0 || ^7.0.0 || ^8.0.0"}, "peerDependenciesMeta": {"@edge-runtime/vm": {"optional": true}, "@opentelemetry/api": {"optional": true}, "@types/node": {"optional": true}, "@vitest/browser-playwright": {"optional": true}, "@vitest/browser-preview": {"optional": true}, "@vitest/browser-webdriverio": {"optional": true}, "@vitest/coverage-istanbul": {"optional": true}, "@vitest/coverage-v8": {"optional": true}, "@vitest/ui": {"optional": true}, "happy-dom": {"optional": true}, "jsdom": {"optional": true}, "vite": {"optional": false}}, "engines": {"node": "^20.0.0 || ^22.0.0 || >=24.0.0"}, "bin": {"vitest": "vitest.mjs"}}, "node_modules/@vitest/runner": {"version": "4.1.11", "dev": true, "license": "MIT", "funding": {"url": "https://opencollective.com/vitest"}, "dependencies": {"@vitest/utils": "4.1.11", "pathe": "^2.0.3"}}, "node_modules/@vitest/spy": {"version": "4.1.11", "dev": true, "license": "MIT", "funding": {"url": "https://opencollective.com/vitest"}}}, "support": {"node_modules/chai": {"range": "^6.2.2", "floor": "6.2.2", "engines": {"node": ">=18"}, "license": "MIT", "no_runtime_edges": true, "source": "https://github.com/chaijs/chai/blob/v6.2.2/package.json"}, "node_modules/es-module-lexer": {"range": "^2.0.0", "floor": "2.0.0", "engines": {}, "license": "MIT", "no_runtime_edges": true, "source": "https://github.com/guybedford/es-module-lexer/blob/2.0.0/package.json"}, "node_modules/std-env": {"range": "^4.0.0-rc.1", "floor": "4.0.0-rc.1", "engines": {}, "license": "MIT", "no_runtime_edges": true, "source": "https://github.com/unjs/std-env/blob/v4.0.0-rc.1/package.json"}, "node_modules/tinyexec": {"range": "^1.0.2", "floor": "1.0.2", "engines": {"node": ">=18"}, "license": "MIT", "no_runtime_edges": true, "source": "https://github.com/tinylibs/tinyexec/blob/1.0.2/package.json"}, "node_modules/tinyrainbow": {"range": "^3.1.0", "floor": "3.1.0", "engines": {"node": ">=14.0.0"}, "license": "MIT", "no_runtime_edges": true, "source": "https://github.com/tinylibs/tinyrainbow/blob/v3.1.0/package.json"}, "node_modules/@standard-schema/spec": {"range": "^1.1.0", "floor": "1.1.0", "engines": {}, "license": "MIT", "no_runtime_edges": true, "source": "https://github.com/standard-schema/standard-schema/blob/v1.1.0/packages/spec/package.json"}, "node_modules/obug": {"range": "^2.1.1", "floor": "2.1.1", "engines": {}, "license": "MIT", "no_runtime_edges": true, "source": "https://github.com/sxzz/obug/blob/v2.1.1/package.json"}}, "deletions": ["node_modules/vite-node", "node_modules/cac", "node_modules/tinypool", "node_modules/tinyspy", "node_modules/strip-literal", "node_modules/strip-literal/node_modules/js-tokens", "node_modules/check-error", "node_modules/deep-eql", "node_modules/loupe", "node_modules/pathval"], "additions": ["node_modules/@standard-schema/spec", "node_modules/obug"], "root_spec": "~4.1.11", "fixed_shared_packages": ["next", "eslint-config-next", "vite", "@vitejs/plugin-react", "react", "react-dom", "jsdom", "braces", "micromatch", "fast-glob"]}')
          PROPOSAL_VERSION = 1
          PROTOCOL_VERSION = 2
          MANIFEST_LIMIT = 16 * 1024
          LOCK_LIMIT = 512 * 1024
          CANDIDATE_TOTAL_LIMIT = 560 * 1024
          REPORT_LIMIT = 512 * 1024
          REPORT_TOTAL_LIMIT = 1024 * 1024
          TOTAL_RAW_EXPORT_LIMIT = 1600 * 1024
          TOTAL_ENCODED_EXPORT_LIMIT = 3 * 1024 * 1024
          DIAGNOSTIC_OUTPUT_LIMIT = 128 * 1024
          SEVERITIES = ('info', 'low', 'moderate', 'high', 'critical')
          WORKSPACE_LINKS = {
              'node_modules/@pdoom/contracts': {'resolved': 'packages/contracts', 'link': True},
              'node_modules/@pdoom/db': {'resolved': 'packages/db', 'link': True},
              'node_modules/@pdoom/observability': {'resolved': 'packages/observability', 'link': True},
              'node_modules/@pdoom/web': {'resolved': 'apps/web', 'link': True},
          }
          PATHS = ['package.json', 'package-lock.json', 'apps/web/package.json',
                   'packages/contracts/package.json', 'packages/db/package.json',
                   'packages/observability/package.json']
          CHANGED_FILES = ['package.json', 'package-lock.json']
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          def read_bounded(path, maximum):
              with path.open('rb') as stream:
                  data = stream.read(maximum + 1)
              if len(data) > maximum:
                  raise ValueError('File byte limit exceeded: ' + str(path.name))
              return data
          
          def read_inputs(root):
              values = {path: read_bounded(root/path, LOCK_LIMIT if path == 'package-lock.json' else MANIFEST_LIMIT)
                        for path in PATHS}
              if sum(map(len, values.values())) > CANDIDATE_TOTAL_LIMIT:
                  raise ValueError('Combined candidate byte limit exceeded.')
              return values
          
          def validate_integrity(value):
              if not isinstance(value, str) or not value.startswith('sha512-') or len(value) > 100:
                  raise ValueError('Missing or invalid SHA-512 registry integrity.')
              try:
                  decoded = base64.b64decode(value[7:], validate=True)
              except ValueError as error:
                  raise ValueError('Invalid registry integrity encoding.') from error
              if len(decoded) != 64:
                  raise ValueError('Invalid registry integrity digest length.')
          
          def public_registry_only(lock):
              for name, package in lock['packages'].items():
                  if not isinstance(package, dict):
                      raise ValueError('Malformed lock entry.')
                  if name in WORKSPACE_LINKS:
                      if package != WORKSPACE_LINKS[name]:
                          raise ValueError('Changed workspace link: ' + name)
                      continue
                  if 'link' in package:
                      raise ValueError('Unexpected link field: ' + name)
                  if not name.startswith('node_modules/'):
                      continue
                  resolved = package.get('resolved')
                  if not isinstance(resolved, str) or not resolved:
                      raise ValueError('Missing registry resolution: ' + name)
                  url = urlparse(resolved)
                  if (url.scheme != 'https' or url.netloc != 'registry.npmjs.org'
                          or url.username or url.password or url.query or url.fragment):
                      raise ValueError('Non-public-registry dependency; refusing resolution/audit.')
                  validate_integrity(package.get('integrity'))
          
          def bounded_run(command, *, env, cwd, timeout, stdout_limit, stderr_limit):
              # Drain binary pipes incrementally and enforce limits before appending data.
              # No unbounded capture_output/communicate call is used.
              process = subprocess.Popen(command, env=env, cwd=cwd, stdout=subprocess.PIPE,
                                         stderr=subprocess.PIPE, start_new_session=True)
              buffers = {'stdout': bytearray(), 'stderr': bytearray()}
              limits = {'stdout': stdout_limit, 'stderr': stderr_limit}
              deadline = time.monotonic() + timeout
              selector = selectors.DefaultSelector()
              try:
                  for name, stream in [('stdout', process.stdout), ('stderr', process.stderr)]:
                      os.set_blocking(stream.fileno(), False)
                      selector.register(stream, selectors.EVENT_READ, name)
                  while selector.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise subprocess.TimeoutExpired(command, timeout)
                      for key, _ in selector.select(min(remaining, 0.1)):
                          data = os.read(key.fileobj.fileno(), 8192)
                          if not data:
                              selector.unregister(key.fileobj)
                              continue
                          name = key.data
                          if len(buffers[name]) + len(data) > limits[name]:
                              raise ValueError('Subprocess ' + name + ' byte limit exceeded.')
                          buffers[name].extend(data)
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise subprocess.TimeoutExpired(command, timeout)
                  code = process.wait(timeout=remaining)
                  return subprocess.CompletedProcess(command, code, bytes(buffers['stdout']), bytes(buffers['stderr']))
              except BaseException:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=5)
                  raise
              finally:
                  selector.close()
                  process.stdout.close()
                  process.stderr.close()
          
          def validate_audit(raw, code):
              if not isinstance(raw, bytes) or len(raw) > REPORT_LIMIT:
                  raise ValueError('Audit byte limit exceeded or non-binary capture.')
              report = json.loads(raw.decode('utf-8'))
              if (not isinstance(report, dict) or type(report.get('auditReportVersion')) is not int
                      or report['auditReportVersion'] != 2 or 'error' in report):
                  raise ValueError('Invalid audit report envelope.')
              entries = report.get('vulnerabilities')
              metadata = report.get('metadata')
              counts = metadata.get('vulnerabilities') if isinstance(metadata, dict) else None
              if not isinstance(entries, dict) or not isinstance(counts, dict):
                  raise ValueError('Missing audit entries/counts.')
              if set(counts) != set(SEVERITIES) | {'total'}:
                  raise ValueError('Unexpected audit count fields.')
              if any(type(value) is not int or value < 0 for value in counts.values()):
                  raise ValueError('Invalid audit count type/value.')
              observed = {severity: 0 for severity in SEVERITIES}
              for name, entry in entries.items():
                  if (not isinstance(name, str) or not name or not isinstance(entry, dict)
                          or entry.get('name') != name or entry.get('severity') not in observed
                          or type(entry.get('isDirect')) is not bool
                          or not isinstance(entry.get('via'), list)
                          or not isinstance(entry.get('nodes'), list) or not entry['nodes']
                          or any(not isinstance(node, str) or not node for node in entry['nodes'])
                          or not isinstance(entry.get('range'), str)):
                      raise ValueError('Malformed audit package entry.')
                  observed[entry['severity']] += 1
              if counts['total'] != len(entries) or any(counts[key] != value for key, value in observed.items()):
                  raise ValueError('Audit entry/severity/total mismatch.')
              if code != (1 if entries else 0):
                  raise ValueError('Audit exit code inconsistent with findings.')
              return report
          
          def export_chunks(artifacts):
              # Bound the complete export before emitting any bytes, including base64/JSON overhead.
              if sum(len(data) for _, _, data in artifacts) > TOTAL_RAW_EXPORT_LIMIT:
                  raise ValueError('Combined raw export byte limit exceeded.')
              lines = []
              receipts = {}
              total_encoded = 0
              for kind, name, data in artifacts:
                  limit = REPORT_LIMIT if kind == 'audit' else (LOCK_LIMIT if name == 'package-lock.json' else MANIFEST_LIMIT)
                  if len(data) > limit:
                      raise ValueError('Per-artifact export byte limit exceeded.')
                  encoded = base64.b64encode(data).decode('ascii')
                  chunks = [encoded[i:i+4096] for i in range(0, len(encoded), 4096)]
                  receipts[(kind, name)] = {'sha256': digest(data), 'bytes': len(data), 'chunks': len(chunks)}
                  for index, chunk in enumerate(chunks):
                      line = 'PATCH_EXPORT_CHUNK ' + json.dumps({'kind': kind, 'name': name, 'index': index,
                                 'total': len(chunks), 'base64': chunk}, separators=(',', ':'))
                      total_encoded += len(line.encode('utf-8')) + 1
                      if total_encoded > TOTAL_ENCODED_EXPORT_LIMIT:
                          raise ValueError('Combined encoded export byte limit exceeded.')
                      lines.append(line)
              for line in lines:
                  print(line)
              return receipts
          
          def semver_in_support_range(version, floor):
              # These seven reviewed support ranges are simple positive-major carets.
              # std-env alone permits same-base rc prereleases, explicitly declared upstream.
              import re
              pattern = r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.(0|[1-9][0-9]*))?'
              actual = re.fullmatch(pattern, version) if isinstance(version, str) else None
              minimum = re.fullmatch(pattern, floor)
              if not actual or not minimum:
                  return False
              av = tuple(int(x) for x in actual.groups()[:3])
              mv = tuple(int(x) for x in minimum.groups()[:3])
              if av[0] != mv[0] or av < mv:
                  return False
              apr, mpr = actual.group(4), minimum.group(4)
              if apr is not None:
                  return mpr is not None and av == mv and int(apr) >= int(mpr)
              return True
          
          def registry_identity(name, entry):
              version = entry.get('version')
              package_name = name.removeprefix('node_modules/')
              tarname = package_name.rsplit('/', 1)[-1]
              expected_url = 'https://registry.npmjs.org/' + package_name + '/-/' + tarname + '-' + str(version) + '.tgz'
              if entry.get('resolved') != expected_url or entry.get('dev') is not True:
                  raise ValueError('Unexpected registry identity or non-development classification: ' + name)
              validate_integrity(entry.get('integrity'))
          
          def validate_scope(before, after):
              if set(after) != set(PATHS) or any(len(data) > (LOCK_LIMIT if path == 'package-lock.json' else MANIFEST_LIMIT) for path, data in after.items()):
                  raise ValueError('Unexpected candidate files or file byte limit.')
              if sum(map(len, after.values())) > CANDIDATE_TOTAL_LIMIT:
                  raise ValueError('Combined candidate byte limit exceeded.')
              expected = dict(before)
              root = before['package.json'].decode()
              old_spec = '"vitest": "^3.2.4"'
              if root.count(old_spec) != 1:
                  raise ValueError('Unexpected baseline Vitest spec.')
              expected['package.json'] = root.replace(old_spec, '"vitest": "~4.1.11"').encode()
              for path in PATHS:
                  if path != 'package-lock.json' and after[path] != expected[path]:
                      raise ValueError('Unexpected manifest change: ' + path)
              old_lock, new_lock = json.loads(before['package-lock.json']), json.loads(after['package-lock.json'])
              public_registry_only(new_lock)
              if {k:v for k,v in old_lock.items() if k != 'packages'} != {k:v for k,v in new_lock.items() if k != 'packages'}:
                  raise ValueError('Unexpected lockfile top-level metadata change.')
              old, new = old_lock['packages'], new_lock['packages']
              deleted, added = set(old) - set(new), set(new) - set(old)
              if deleted != set(POLICY['deletions']) or added != set(POLICY['additions']):
                  raise ValueError('Lock path additions/removals need separate scope review: ' + json.dumps({'deleted': sorted(deleted), 'added': sorted(added)}))
              replacements = set(POLICY['family_metadata']) | set(POLICY['support'])
              allowed = replacements | {''}
              changed = {name for name in old.keys() & new.keys() if old[name] != new[name]}
              outside = changed - allowed
              if outside:
                  raise ValueError('Unrelated/shared package changes need separate review: ' + json.dumps(sorted(outside)))
              expected_root = copy.deepcopy(old[''])
              expected_root['devDependencies']['vitest'] = ROOT_SPEC
              if new[''] != expected_root:
                  raise ValueError('Unexpected root lock metadata.')
              for name, metadata in POLICY['family_metadata'].items():
                  registry_identity(name, new[name])
                  expected_entry = copy.deepcopy(metadata)
                  expected_entry['resolved'] = new[name]['resolved']
                  expected_entry['integrity'] = new[name]['integrity']
                  if new[name] != expected_entry:
                      fields = sorted(key for key in set(new[name]) | set(expected_entry) if new[name].get(key) != expected_entry.get(key))
                      raise ValueError('Published Vitest metadata differs from reviewed tagged metadata: ' + name + ' fields=' + json.dumps(fields))
              for name, requirement in POLICY['support'].items():
                  entry = new[name]
                  registry_identity(name, entry)
                  if not semver_in_support_range(entry['version'], requirement['floor']):
                      raise ValueError('Unapproved support version: ' + name)
                  permitted = {'version','resolved','integrity','dev','license','engines','funding'}
                  if set(entry) - permitted:
                      raise ValueError('Support metadata/new dependency edges require review: ' + name + ' fields=' + json.dumps(sorted(set(entry)-permitted)))
                  if entry.get('license') != requirement['license'] or entry.get('engines', {}) != requirement['engines']:
                      raise ValueError('Support license/engine metadata requires review: ' + name)
                  if 'funding' in entry and (not isinstance(entry['funding'], (str,dict,list)) or len(json.dumps(entry['funding']).encode()) > 2048):
                      raise ValueError('Unexpected funding metadata shape/size.')
              # Every ordinary dependency requested by the new family must resolve to one
              # known, retained path. The one nested picomatch is deliberately not rehoisted.
              for name, metadata in POLICY['family_metadata'].items():
                  for dependency in metadata.get('dependencies', {}):
                      target = 'node_modules/' + dependency
                      if dependency == 'picomatch' and name == 'node_modules/vitest':
                          target = 'node_modules/vitest/node_modules/picomatch'
                      if target not in new:
                          raise ValueError('Required Vitest dependency missing from bounded graph: ' + target)
              return {'updated': sorted(changed), 'added': sorted(added), 'removed': sorted(deleted)}
          
          def run_npm(npm, args, env, work, label):
              is_audit = args[0] == 'audit'
              result = bounded_run([npm, *args], env=env, cwd=work, timeout=120,
                                   stdout_limit=REPORT_LIMIT if is_audit else DIAGNOSTIC_OUTPUT_LIMIT,
                                   stderr_limit=DIAGNOSTIC_OUTPUT_LIMIT)
              # Audit stdout stays raw binary until bounded base64 export, preserving all
              # newline encodings and Unicode separators exactly. Other logs are diagnostic only.
              if not is_audit:
                  for line in result.stdout.decode('utf-8', errors='replace').splitlines():
                      print(label + '_STDOUT ' + line)
              for line in result.stderr.decode('utf-8', errors='replace').splitlines():
                  print(label + '_STDERR ' + line)
              return result
          
          def main():
              source = Path(os.environ['GITHUB_WORKSPACE']) / 'source'
              root = Path(tempfile.mkdtemp(prefix='pdoom-vitest-resolver-', dir=os.environ['RUNNER_TEMP']))
              work, home, cache = root/'input', root/'home', root/'cache'
              for directory in [work, home, cache]:
                  directory.mkdir()
              before = read_inputs(source)
              if set(before) != set(EXPECTED_INPUT_SHA256) or any(digest(data) != EXPECTED_INPUT_SHA256[path] for path, data in before.items()):
                  raise ValueError('At least one of the six pinned base manifest/lock hashes differs.')
              public_registry_only(json.loads(before['package-lock.json']))
              for path, data in before.items():
                  target = work/path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              for name in ['user.npmrc', 'global.npmrc']:
                  (home/name).write_text('')
              env = {'PATH': os.environ['PATH'], 'HOME': str(home), 'CI': 'true',
                     'npm_config_userconfig': str(home/'user.npmrc'),
                     'npm_config_globalconfig': str(home/'global.npmrc'),
                     'npm_config_cache': str(cache)}
              npm = shutil.which('npm')
              if not npm:
                  raise ValueError('npm unavailable.')
              versions = {}
              for tool in ['node', 'npm']:
                  result = bounded_run([tool, '--version'], env=env, cwd=work, timeout=10, stdout_limit=1024, stderr_limit=1024)
                  if result.returncode != 0:
                      raise ValueError('Version lookup failed.')
                  versions[tool] = result.stdout.decode('ascii').strip()
              common = ['--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund',
                        '--save-prefix=~', '--registry=https://registry.npmjs.org',
                        '--fetch-retries=1', '--fetch-timeout=20000',
                        '--fetch-retry-mintimeout=1000', '--fetch-retry-maxtimeout=2000']
              # npm's install command is used ONLY in package-lock-only mode: it resolves
              # registry metadata, writes the copied lock/manifests, and installs no packages.
              commands = [['install', 'vitest@4.1.11', '--save-dev', *common]]
              for index, args in enumerate(commands):
                  result = run_npm(npm, args, env, work, 'RESOLVER_' + str(index))
                  if result.returncode != 0:
                      raise ValueError('Metadata-only resolver failed with exit ' + str(result.returncode))
                  if any(work.rglob('node_modules')):
                      raise ValueError('Unexpected node_modules creation.')
              actual_files = {str(path.relative_to(work)) for path in work.rglob('*') if path.is_file()}
              if actual_files != set(PATHS):
                  raise ValueError('Unexpected files created in isolated resolver input.')
              after = read_inputs(work)
              changed_entries = validate_scope(before, after)
              receipt = {'proposal_version': PROPOSAL_VERSION, 'protocol_version': PROTOCOL_VERSION, 'proposal_kind': 'vitest-4.1.11', 'base_commit': BASE_COMMIT, 'target_version': TARGET, 'versions': versions,
                         'input_sha256': {path:digest(data) for path,data in before.items()},
                         'lock_changes': changed_entries, 'files': {}, 'audits': {},
                         'source_unchanged': read_inputs(source) == before,
                         'node_modules_created': False}
              artifacts = [('file', path, after[path]) for path in CHANGED_FILES]
              report_bytes = 0
              failed = not receipt['source_unchanged']
              for mode, flags in [('all', []), ('omit-dev', ['--omit=dev'])]:
                  args = ['audit', '--package-lock-only', '--ignore-scripts', '--json',
                          '--registry=https://registry.npmjs.org', '--fetch-retries=1',
                          '--fetch-timeout=20000', '--fetch-retry-mintimeout=1000',
                          '--fetch-retry-maxtimeout=2000', *flags]
                  try:
                      result = run_npm(npm, args, env, work, 'PATCH_AUDIT_' + mode)
                      report_bytes += len(result.stdout)
                      if report_bytes > REPORT_TOTAL_LIMIT:
                          raise ValueError('Combined audit report byte limit exceeded.')
                      artifacts.append(('audit', mode, result.stdout))
                      report = validate_audit(result.stdout, result.returncode)
                  except (subprocess.TimeoutExpired, ValueError, UnicodeDecodeError) as error:
                      receipt['audits'][mode] = {'status': 'retrieval_or_validation_failed', 'reason': str(error)[:512]}
                      failed = True
                      break
                  receipt['audits'][mode] = {'status': 'audit_completed', 'exit_code': result.returncode,
                          'counts': report['metadata']['vulnerabilities'],
                          'package_entries': sorted(report['vulnerabilities']),
                          'sha256': digest(result.stdout), 'bytes': len(result.stdout)}
                  if mode == 'omit-dev' and report['vulnerabilities']:
                      failed = True
                  if mode == 'all' and any(name in report['vulnerabilities'] for name in ['vitest', '@vitest/mocker', 'tinypool']):
                      failed = True
              exports = export_chunks(artifacts)
              for path in CHANGED_FILES:
                  receipt['files'][path] = exports[('file', path)]
              for mode in receipt['audits']:
                  if ('audit', mode) in exports:
                      receipt['audits'][mode]['raw_export'] = exports[('audit', mode)]
              receipt['resolved_inputs_unchanged_by_audit'] = read_inputs(work) == after
              receipt['node_modules_created'] = any(work.rglob('node_modules'))
              failed |= not receipt['resolved_inputs_unchanged_by_audit'] or receipt['node_modules_created']
              receipt['status'] = 'needs_review_or_retrieval' if failed else 'candidate_ready_for_diff_review'
              print('PATCH_RESOLVER_RECEIPT ' + json.dumps(receipt, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
                  summary.write('Metadata-only Vitest 4.1.11 candidate. No application code or installed dependencies ran.\n\n')
                  summary.write('Full diff review and all repository CI gates are still required. Omit-dev is not a runtime-image inventory.\n\n')
                  summary.write('```json\n' + json.dumps(receipt,indent=2) + '\n```\n')
              return 3 if failed else 0
          
          if __name__ == '__main__':
              try:
                  sys.exit(main())
              except (ValueError, subprocess.TimeoutExpired) as error:
                  print('PATCH_RESOLVER_BLOCKED ' + json.dumps({'reason':str(error)}))
                  sys.exit(3)
          PYCODE
