name: Vitest 4.1.11 resolver with isolated npm 11.20.0

on:
  push:
    branches: [audit/vitest-4-1-11-resolver-2026-10-08]
    paths: [.github/workflows/resolve-vitest-once.yml]

# Installs only the exact trusted npm toolchain in a temporary sibling prefix.
# Application resolution stays lockfile-only. Never merge this diagnostic branch.
permissions:
  contents: read
concurrency:
  group: vitest-4-1-11-resolver-2026-10-08
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'mishakgg/pdoom-live'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 87dda3d74f9f9874e82d83d1628b53f9da4b5526
          persist-credentials: false
          fetch-depth: 1
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          check-latest: false
      - name: Provision pinned npm toolchain, resolve approved app metadata, and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          """Vitest 4.1.11 lock-only resolver with isolated trusted npm toolchain installation."""
          import base64
          import copy
          import hashlib
          import json
