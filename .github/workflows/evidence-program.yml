name: Evidence program

on:
  push:
    paths:
      - "docs/evidence-program/**"
      - "data/evidence-program/**"
      - "tools/evidence_program/**"
      - "README.md"
      - ".github/workflows/evidence-program.yml"
  pull_request:
    paths:
      - "docs/evidence-program/**"
      - "data/evidence-program/**"
      - "tools/evidence_program/**"
      - "README.md"
      - ".github/workflows/evidence-program.yml"

# Deterministic fixture checks only. No production or collection credentials.
permissions:
  contents: read

jobs:
  evidence-program:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned CI-only schema tools
        run: python -m pip install --disable-pip-version-check -r tools/evidence_program/requirements-ci.txt
      - name: Check evidence program offline
        run: python tools/evidence_program/check.py
