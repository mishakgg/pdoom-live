# Single-VM production stack. Secrets come from the deploy user's env file:
#   docker compose --env-file /etc/pdoom/production.env -f compose.production.yaml up -d
# That file is mode 600 and lives outside the checkout. Local development stays on
# compose.yaml, which publishes Postgres on 127.0.0.1.
# docker compose down -v deletes the pdoom-pgdata volume and the live database.
name: pdoom-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  internal:
    name: pdoom-prod

volumes:
  pgdata:
    name: pdoom-pgdata
  caddy_data:
    name: pdoom-caddy-data
  caddy_config:
    name: pdoom-caddy-config

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: pdoom-prod-caddy
    restart: unless-stopped
    logging: *logging
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /etc/pdoom/production.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Mount the directory so atomic upstream replacements remain visible.
      - ./deploy/state:/etc/caddy/state:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ${PDOOM_WEB_IMAGE:?set PDOOM_WEB_IMAGE to an immutable pdoom-live:<commit> tag}
    container_name: pdoom-prod-web
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PDOOM_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in /etc/pdoom/production.env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in /etc/pdoom/production.env}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      PDOOM_MIGRATIONS_DIR: /app/migrations
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: pdoom-prod-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in /etc/pdoom/production.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /etc/pdoom/production.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in /etc/pdoom/production.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    # No host port. The database is reachable only on the internal Docker network.
